org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.mpp.applyDefaultHierarchyTemplate=true

finpulse.compileSdk=37
finpulse.compileSdkMinor=1
finpulse.minSdk=28
finpulse.targetSdk=36
finpulse.cloud.enabled=false

# The plain detekt task reads every src/**/*.kt, including iOS.
# Type-resolution tasks only see JVM and Android, so they stay off.
detekt.android.disabled=true
detekt.multiplatform.disabled=true
